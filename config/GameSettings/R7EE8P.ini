; NiGHTS: Journey of Dreams (USA)
[Core]
; The game parks a low-priority thread in `for (;;) OSWakeupThread(...)`
; (0x80366220). Skipping to the next scheduled event whenever it returns to
; 0x8036623C stops it from burning host time at roughly 15M dispatches/s.
StaticRecompIdlePC = 0x8036623C
; Dual core: run the emulated GPU (FIFO, vertex loading, texture hashing) on
; its own host thread. This Dolphin fork defaults it off on desktop; netplay
; already turns it on. In gameplay that work is ~15-20% of the CPU thread.
CPUThread = True
