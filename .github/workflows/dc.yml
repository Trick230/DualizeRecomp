# devcloud (https://github.com/Trick230/devcloud): `dc run` dispatches this; pinned to one
# devcloud commit (`dc init` again moves the pin to the current one)
name: dc
run-name: dc ${{ inputs.id }} ${{ inputs.title || inputs.commands }}
on:
  workflow_dispatch:
    inputs:
      id: {default: ""}
      commands: {required: true}
      os: {default: ubuntu-latest}
      drive_in: {default: ""}
      drive_out: {default: ""}
      artifacts: {default: ""}
      title: {default: ""}   # the run's short name (dc run sets it)
  workflow_call:   # the project's own workflows reuse it: `uses: ./.github/workflows/dc.yml`
    inputs:
      id: {type: string, default: ""}
      commands: {type: string, required: true}
      os: {type: string, default: ubuntu-latest}
      drive_in: {type: string, default: ""}
      drive_out: {type: string, default: ""}
      artifacts: {type: string, default: ""}
      artifacts_in: {type: string, default: ""}   # artifacts of the calling run, into this folder
    secrets:
      DC_ENV: {required: false}
jobs:
  run:
    uses: Trick230/devcloud/.github/workflows/run.yml@c3d20f43bb30a02d03d0c00bd0d029c18205219a
    with: {commands: "${{ inputs.commands }}", os: "${{ inputs.os }}", drive_in: "${{ inputs.drive_in }}", drive_out: "${{ inputs.drive_out }}", artifacts: "${{ inputs.artifacts }}", artifacts_in: "${{ inputs.artifacts_in }}", ref: c3d20f43bb30a02d03d0c00bd0d029c18205219a}
    secrets: {DC_ENV: "${{ secrets.DC_ENV }}"}
