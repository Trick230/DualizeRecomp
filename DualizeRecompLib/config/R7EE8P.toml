# NiGHTS: Journey of Dreams (USA), recompiled by tools/DolRecomp.
# Paths are relative to the extracted disc, except natives (next to this file).

[main]
dol = "sys/main.dol"
# Functions with host implementations, found by signature: DolRecomp's own
# (runtime/sdk) and DualizeRecomp/sdk's. Each matches only the SDK build it was
# written for; the recompiler writes what it found to natives.txt.
natives = ["@mwcc", "@rvl", "sdk.sigs"]
# Fixed number of generated sources, so the build can list them up front.
shards = 64

# Much of the game's code ships in RSO modules (files/rso) that the game loads
# into the heap at run time. Boot and heap order are deterministic, so each
# module always lands at the same address; linking them there ahead of time
# reproduces their loaded text byte for byte. If a module ever lands
# elsewhere, the runtime's chunk hash check sees different bytes and that code
# stays on the interpreter.
#
# Values read back from guest RAM during gameplay (the RSO list starting at
# the static module header, 0x904B0120).
[rso]
sel = "files/rso/NightsWii.sel"
# NightsWii.sel section index -> run-time address (.init, .text, .rodata,
# .data, .bss, .sdata, .sdata2, .sbss, .sbss2).
static_sections = [
    0, 0x80004000, 0x8000BB20, 0, 0, 0x804E7400, 0x8050FA20,
    0x80581780, 0x806F5600, 0x806F7120, 0, 0x806F6640, 0x806F7D60,
]
modules = [
    { file = "files/rso/global.rso", base = 0x8106E4C0, bss = 0x812C7F80 },
    { file = "files/rso/play.rso", base = 0x8154B780 },
    { file = "files/rso/select.rso", base = 0x81577020, bss = 0x815B4580 },
    { file = "files/rso/title.rso", base = 0x81732020, bss = 0x81731FA0 },
]
# One stage (or the dream select, staff roll, 2P loading) at a time, each
# into the same memory title.rso used: the module heap hands them out top
# down from 0x81796040, so a module of file size F and bss size B (header
# +0x1C) lands at base = 0x81796040 - round32(F), its bss at
# base - 0x20 - round32(B). Read back for stage1000; the rest follow the
# same allocator.
overlays = [
    { file = "files/rso/stage1000.rso", base = 0x8176D320, bss = 0x8176D280 },
    { file = "files/rso/stage1010.rso", base = 0x817731E0, bss = 0x81773160 },
    { file = "files/rso/stage1100.rso", base = 0x817738C0, bss = 0x81773740 },
    { file = "files/rso/stage1110.rso", base = 0x8176EA60, bss = 0x8176E9E0 },
    { file = "files/rso/stage1200.rso", base = 0x81770A60, bss = 0x81770980 },
    { file = "files/rso/stage1210.rso", base = 0x81762600, bss = 0x817625A0 },
    { file = "files/rso/stage2000.rso", base = 0x817713A0, bss = 0x81771320 },
    { file = "files/rso/stage2010.rso", base = 0x8176CD80, bss = 0x8176CD00 },
    { file = "files/rso/stage2100.rso", base = 0x8176F260, bss = 0x8176F1E0 },
    { file = "files/rso/stage2110.rso", base = 0x81775060, bss = 0x81774F80 },
    { file = "files/rso/stage2200.rso", base = 0x8176A640, bss = 0x8176A4A0 },
    { file = "files/rso/stage2210.rso", base = 0x81773EA0, bss = 0x81773E40 },
    { file = "files/rso/stage3000.rso", base = 0x8176EF60, bss = 0x8176EEC0 },
    { file = "files/rso/stage3010.rso", base = 0x81769720, bss = 0x817696E0 },
    { file = "files/rso/stage4000.rso", base = 0x81767660, bss = 0x81767600 },
    { file = "files/rso/myDream.rso", base = 0x8171E600, bss = 0x8171DB40 },
    { file = "files/rso/staffRoll.rso", base = 0x8177ECE0 },
    { file = "files/rso/loading2P.rso", base = 0x8178C0A0 },
]
